name: ZIG daily song

# One original ZIG song per Japan-time day, generated by SONOVA (https://github.com/Yuji5124/SONOVA) and
# PROPOSED to this repository as a pull request. Nothing reaches `main` until the PR is merged (= approved).
#
# Free: GitHub Actions on a public repository (standard runners), no paid API / cloud AI / API key / GPU,
# and no secret beyond the built-in GITHUB_TOKEN.

on:
  schedule:
    # 07:00 Japan time. `timezone` is GitHub's native schedule time zone (Asia/Tokyo has no daylight saving).
    - cron: '0 7 * * *'
      timezone: 'Asia/Tokyo'
    # Retry slot at 09:30: scheduled runs can be delayed or dropped under load. Running twice is safe because
    # the job is idempotent (a day that already has a song, or an open proposal, is skipped).
    - cron: '30 9 * * *'
      timezone: 'Asia/Tokyo'
  workflow_dispatch:
    inputs:
      date:
        description: 'YYMMDD to generate (empty = today in Asia/Tokyo)'
        required: false
        default: ''
      dry_run:
        description: 'Only show what would be registered; change nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zig-daily
  cancel-in-progress: false

jobs:
  zig-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out SOUNDVAULT
        uses: actions/checkout@v4
        with:
          path: soundvault

      - name: Decide whether to run
        id: guard
        working-directory: soundvault
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          stamp="${INPUT_DATE:-$(TZ=Asia/Tokyo date +%y%m%d)}"
          if ! [[ "$stamp" =~ ^[0-9]{6}$ ]]; then
            echo "::error title=Bad date::date must be YYMMDD, got '$stamp'"
            exit 1
          fi
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          if [ "${INPUT_DRY:-false}" = "true" ]; then
            echo "skip=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An earlier proposal still waiting for approval would conflict on data/sounds.json: do not stack another.
          pending=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("zig-daily/"))] | length')
          if [ "$pending" != "0" ]; then
            echo "::warning title=ZIG daily NOT generated::${pending} earlier ZIG proposal(s) (zig-daily/* pull requests) are still open. Merge or close them; the next run will generate today's song."
            echo "### ZIG daily ${stamp}: skipped (pending approval)" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=pending-pr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "zig-daily/${stamp}" > /dev/null 2>&1; then
            echo "::notice title=ZIG daily ${stamp}::already proposed (branch zig-daily/${stamp} exists)"
            echo "### ZIG daily ${stamp}: already proposed" >> "$GITHUB_STEP_SUMMARY"
            echo "skip=already-proposed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"

      - name: Check out SONOVA (public, default branch)
        if: steps.guard.outputs.skip == ''
        uses: actions/checkout@v4
        with:
          repository: Yuji5124/SONOVA
          path: sonova
          persist-credentials: false

      - name: Set up Node.js
        if: steps.guard.outputs.skip == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Make sure ffmpeg with Vorbis is available
        if: steps.guard.outputs.skip == ''
        run: |
          if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libvorbis; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libvorbis

      - name: Check that SONOVA provides zig:daily
        if: steps.guard.outputs.skip == ''
        working-directory: sonova
        run: |
          if ! jq -e '.scripts["zig:daily"]' package.json > /dev/null; then
            echo "::error title=SONOVA is not ready::SONOVA's default branch has no 'zig:daily' script yet. Merge the SONOVA change first."
            exit 1
          fi

      - name: Install SONOVA dependencies
        if: steps.guard.outputs.skip == ''
        working-directory: sonova
        run: npm ci

      - name: Generate and register (ZIG daily)
        id: zig
        if: steps.guard.outputs.skip == ''
        working-directory: sonova
        env:
          STAMP: ${{ steps.guard.outputs.stamp }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          args=(--vault ../soundvault --out ../zig-out --date "$STAMP")
          if [ "${INPUT_DRY:-false}" = "true" ]; then args+=(--dry-run); fi
          npm run zig:daily -- "${args[@]}"

      - name: Upload run logs
        if: always() && steps.guard.outputs.skip == ''
        uses: actions/upload-artifact@v4
        with:
          name: zig-daily-${{ steps.guard.outputs.stamp }}
          path: zig-out/*.run.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Check that SOUNDVAULT still builds
        if: steps.zig.outputs.status == 'registered'
        working-directory: soundvault
        run: |
          npm ci
          npm run build

      - name: Propose the song as a pull request
        if: steps.zig.outputs.status == 'registered'
        working-directory: soundvault
        env:
          STAMP: ${{ steps.guard.outputs.stamp }}
          DISPLAY_NAME: ${{ steps.zig.outputs.display_name }}
          WORK_NUMBER: ${{ steps.zig.outputs.work_number }}
          FILE: ${{ steps.zig.outputs.file }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # 1) Exactly what we expect, by change KIND (not just by path): the song's audio file and one run record may be
          #    NEW; the two sounds indexes and the two projects indexes may be MODIFIED. Anything else (a modified or
          #    deleted existing audio file, a stray file) stops the job before anything is committed.
          if ! [[ "$FILE" =~ ^/sounds/bgm/[A-Za-z0-9._-]+\.(ogg|wav)$ ]]; then
            echo "::error title=Bad file path::$FILE"
            exit 1
          fi
          song="public${FILE}"
          test -f "$song" || { echo "::error title=Missing audio::$song"; exit 1; }
          bad=""
          new_audio=0
          new_record=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            code="${line:0:2}"
            path="${line:3}"
            if [[ "$code" == "??" && "$path" == "$song" ]]; then new_audio=$((new_audio + 1))
            elif [[ "$code" == "??" && "$path" =~ ^data/zig-daily/[A-Za-z0-9._-]+\.json$ ]]; then new_record=$((new_record + 1))
            elif [[ "$code" == " M" && "$path" =~ ^(public/)?data/(sounds|projects)\.json$ ]]; then :
            else bad="${bad}%0A${code} ${path}"
            fi
          done < <(git status --porcelain --untracked-files=all)
          if [ -n "$bad" ] || [ "$new_audio" != "1" ] || [ "$new_record" != "1" ]; then
            echo "::error title=Unexpected changes::new audio=${new_audio} new record=${new_record} unexpected:${bad}"
            exit 1
          fi
          # 2) Second line of defence: every record that was in sounds.json is still there, byte-for-byte equal as JSON,
          #    and exactly one record was added.
          changed=$(jq -n --slurpfile old <(git show HEAD:data/sounds.json) --slurpfile new data/sounds.json \
            '($old[0] | map({(.id): .}) | add) as $o | ($new[0] | map({(.id): .}) | add) as $n
             | [$o | to_entries[] | select($n[.key] != .value)] | length')
          added=$(jq -n --slurpfile old <(git show HEAD:data/sounds.json) --slurpfile new data/sounds.json '($new[0] | length) - ($old[0] | length)')
          if [ "$changed" != "0" ] || [ "$added" != "1" ]; then
            echo "::error title=Existing records changed::changed or removed=${changed}, added=${added} (expected 0 and 1)"
            exit 1
          fi
          branch="zig-daily/${STAMP}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/sounds data public/data
          git diff --cached --name-status
          git commit -m "ZIG daily ${STAMP}: ${DISPLAY_NAME}"
          git push origin "$branch"
          cat > ../zig-out/pr-body.md <<BODY
          ZIG ${STAMP} のデイリー曲を提案します。**マージすると SOUNDVAULT に公開されます** (この PR をマージするまで main は変わりません)。

          - 曲名: \`${DISPLAY_NAME}\`
          - 作品番号: \`${WORK_NUMBER}\`
          - ファイル: \`${FILE}\`
          - 生成: SONOVA (無料・ローカル CPU のみ)。インストゥルメンタル。既存曲の旋律・歌詞・音源・声は使っていません。
          - 参照元と生成条件: \`data/zig-daily/\` の記録と、sounds.json の \`sonova.references\` / \`sonova.generation\`
          - 既存レコードは変更していません (登録時に検証済み)。サイトのビルドも確認済みです。

          気に入らない場合は、この PR をマージせずにクローズしてください (翌日以降の曲は引き続き作られます)。
          BODY
          gh pr create --base "$BASE" --head "$branch" --title "ZIG daily ${STAMP}: ${DISPLAY_NAME}" --body-file ../zig-out/pr-body.md
